<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokin · Refinamiento IA</title>
<script>try{var t=localStorage.getItem('rf_theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =================== TEMAS =================== */
:root{
  --bg:#0E0612;--ink:#F6EAF4;--muted:#B79AB4;--soft:#E2CFE0;
  --line:rgba(255,140,210,.16);--line2:rgba(255,140,210,.08);
  --glass:rgba(50,15,50,.42);--glass-hi:rgba(80,22,72,.55);--field:rgba(255,255,255,.04);--hover:rgba(255,255,255,.03);
  --tk:#FF4FB8;--tk-rgb:255,79,184;--tk-soft:#FFB3DE;--tk-ink:#fff;
  --ux:#B47CFF;--it:#38E1FF;--be:#7AA2FF;--qa:#2BE38A;--warn:#FFC53D;--good:#2BE38A;--bad:#FF5D73;
  --modal:#1A0A1C;--shadow:0 20px 60px rgba(0,0,0,.28);--glow:1;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#FBF6FA;--ink:#22092A;--muted:#7D6279;--soft:#4A3148;
  --line:rgba(170,30,120,.16);--line2:rgba(170,30,120,.08);
  --glass:rgba(255,255,255,.72);--glass-hi:#fff;--field:#fff;--hover:rgba(233,30,140,.04);
  --tk:#E6198A;--tk-rgb:230,25,138;--tk-soft:#B0106A;--tk-ink:#fff;
  --ux:#7C3AED;--it:#0A8FB3;--be:#2F5BD9;--qa:#0E9461;--warn:#B7791F;--good:#0E9461;--bad:#D92D4A;
  --modal:#fff;--shadow:0 14px 40px rgba(90,14,74,.10);--glow:0;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--tk)}
:focus-visible{outline:2px solid var(--tk);outline-offset:3px;border-radius:8px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.lg{width:20px;height:20px}

/* =================== FONDO =================== */
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:radial-gradient(40% 35% at 18% 22%,rgba(var(--tk-rgb),.20),transparent 70%),
             radial-gradient(35% 30% at 85% 78%,rgba(90,14,74,.55),transparent 70%),
             radial-gradient(30% 25% at 70% 10%,rgba(56,225,255,.07),transparent 70%);
  animation:drift 18s ease-in-out infinite alternate}
[data-theme=light] .aurora{background:radial-gradient(40% 35% at 15% 15%,rgba(var(--tk-rgb),.10),transparent 70%),radial-gradient(35% 30% at 90% 80%,rgba(180,124,255,.10),transparent 70%),radial-gradient(30% 25% at 70% 5%,rgba(56,225,255,.08),transparent 70%)}
@keyframes drift{to{transform:translate(3%,-2%) scale(1.05)}}
.floor{position:fixed;left:-50%;right:-50%;bottom:-12%;height:45%;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);
  background-size:60px 60px;transform:perspective(500px) rotateX(62deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(to top,#000 5%,transparent 80%);mask-image:linear-gradient(to top,#000 5%,transparent 80%);
  animation:floor 4s linear infinite}
@keyframes floor{to{background-position:0 60px,0 0}}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px)}
[data-theme=light] .scan{display:none}
.app{position:relative;z-index:2}

/* =================== HEADER =================== */
header.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(14px,3vw,32px)}
.hrow{display:flex;align-items:center;gap:12px;padding:13px 0}
.brand{display:flex;align-items:center;gap:14px;cursor:pointer;min-width:0}
.brand img{height:24px;width:auto;display:block}
[data-theme=dark] .brand img{filter:drop-shadow(0 0 14px rgba(255,79,184,.35))}
.brand .lw{display:none}.brand .ld{display:block}
[data-theme=light] .brand .lw{display:none}[data-theme=light] .brand .ld{display:block}
[data-theme=dark] .brand .lw{display:block}[data-theme=dark] .brand .ld{display:none}
.brand small{padding-left:14px;border-left:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:600;line-height:1.25;white-space:nowrap}
.brand small b{display:block;color:var(--ink);font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:-.01em}
.spacer{flex:1}
.status{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 13px;white-space:nowrap}
.status b{color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;box-shadow:0 0 calc(10px*var(--glow)) var(--warn)}
.dot.live{background:var(--good);box-shadow:0 0 calc(10px*var(--glow)) var(--good);animation:pulse 2s infinite}
.dot.rec{background:var(--bad);box-shadow:0 0 10px var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}

/* =================== CONTROLES =================== */
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;transition:border-color .2s,box-shadow .2s,transform .2s,background .2s;text-decoration:none}
.btn:hover{border-color:var(--tk);box-shadow:0 0 calc(18px*var(--glow)) rgba(var(--tk-rgb),.35)}
.btn.primary{background:var(--tk);border-color:var(--tk);color:var(--tk-ink);box-shadow:0 8px 30px rgba(var(--tk-rgb),.38)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 12px 40px rgba(var(--tk-rgb),.55)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--line);box-shadow:none}
.btn.danger:hover{border-color:var(--bad);color:var(--bad);box-shadow:none}
.btn.sm{height:32px;padding:0 12px;font-size:12px;gap:6px}
.btn.sm svg.i{width:14px;height:14px}
.btn[disabled],.btn:disabled{opacity:.4;pointer-events:none}
.ib{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--hover);display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:all .2s;flex:none}
.ib:hover{color:var(--tk);border-color:var(--tk);box-shadow:0 0 calc(14px*var(--glow)) rgba(var(--tk-rgb),.35)}
.ib.sm{width:30px;height:30px;border-radius:10px}
.ib.sm svg.i{width:14px;height:14px}
input[type=text],input[type=password],input[type=url],input[type=search],select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:10px 13px;background:var(--field);color:var(--ink);font-weight:500;outline:none;transition:border-color .2s,box-shadow .2s}
select{height:40px;padding:0 12px;font-weight:600}
select option{background:var(--modal);color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
input:focus,select:focus,textarea:focus{border-color:var(--tk);box-shadow:0 0 0 3px rgba(var(--tk-rgb),.15)}
textarea{resize:vertical;min-height:84px;line-height:1.55}
label.f{display:block;font-weight:700;font-size:12.5px;margin:14px 0 6px}
label.f span{font-weight:500;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:800;white-space:nowrap;background:rgba(var(--tk-rgb),.14);color:var(--tk-soft)}
.chip.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.chip.y{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.err{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.chip.gray{background:var(--hover);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line2)}
.toggle{border:1px solid var(--line);background:var(--hover);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--muted);transition:all .2s}
.toggle:hover{border-color:var(--tk)}
.toggle.on{border-color:var(--tk);color:var(--tk-soft);background:rgba(var(--tk-rgb),.13)}
.areabtn{border:0;background:rgba(var(--tk-rgb),.14);color:var(--tk-soft);font:800 11px var(--body);border-radius:999px;padding:2px 8px;cursor:pointer}
.petal{display:inline-block;width:9px;height:9px;border-radius:50% 50% 0 50%;background:var(--k,var(--tk));box-shadow:0 0 calc(8px*var(--glow)) var(--k,var(--tk));flex:none}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hidden{display:none!important}

/* =================== LAYOUT =================== */
main{padding:28px 0 90px}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.03em}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.kind{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:12.5px;color:var(--tk);margin-bottom:10px;letter-spacing:.02em}
.phead h1{font-size:clamp(26px,3.6vw,46px);font-weight:800;line-height:1.04}
.outline{color:transparent;-webkit-text-stroke:1.3px var(--ink)}
.pink{color:var(--tk);text-shadow:0 0 calc(30px*var(--glow)) rgba(var(--tk-rgb),.45)}
.lead{font-size:15px;line-height:1.6;color:var(--soft);max-width:60ch;margin:12px 0 0}
.card{position:relative;min-width:0;padding:22px;border-radius:22px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(140deg,rgba(var(--tk-rgb),.55),transparent 35%,transparent 70%,rgba(56,225,255,.22));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
[data-theme=light] .card::before{opacity:.5}
.card + .card,.stack > * + *{margin-top:16px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.chead h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
.chead .sub{margin:5px 0 0;color:var(--muted);font-size:12.5px;line-height:1.45}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.kpi .lbl{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .val{font-family:var(--display);font-size:clamp(22px,2.4vw,30px);font-weight:600;margin:10px 0 2px;letter-spacing:-.03em;line-height:1.05}
.kpi .hint{font-size:11.5px;color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.searchbox{position:relative;flex:1;min-width:220px;max-width:360px}
.searchbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox input{padding-left:38px;height:40px;border-radius:999px}
.seg{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--hover);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 13px;border-radius:999px;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:rgba(var(--tk-rgb),.18);color:var(--tk-soft);box-shadow:inset 0 0 0 1px rgba(var(--tk-rgb),.5)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.scard{cursor:pointer;transition:transform .2s,box-shadow .2s;padding:20px}
.scard:hover{transform:translateY(-3px);box-shadow:0 0 0 1px rgba(var(--tk-rgb),.4),0 18px 50px rgba(var(--tk-rgb),.14)}
.scard h3{font-size:16px;font-weight:600;margin:14px 0 6px;line-height:1.25}
.scard .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.scard p{margin:10px 0 0;color:var(--soft);font-size:13px;line-height:1.5}
.scard .foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty b{display:block;font-family:var(--display);font-size:16px;color:var(--ink);margin-bottom:6px;font-weight:600}

/* =================== SESIÓN =================== */
.shead{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.shead input.title{font-family:var(--display);font-size:clamp(20px,2.6vw,30px);font-weight:700;letter-spacing:-.03em;border:1px solid transparent;padding:4px 10px;margin:6px 0 6px -10px;background:transparent;border-radius:14px;width:100%}
.shead input.title:hover{border-color:var(--line)}
.shead select{width:auto;height:32px;border-radius:999px;font-size:12px}
.steps{display:flex;gap:6px;padding:5px;border-radius:999px;border:1px solid var(--line);background:var(--hover);margin-bottom:20px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{border:0;background:none;padding:9px 16px 9px 10px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;gap:9px;align-items:center;transition:all .2s}
.step .n{display:grid;place-items:center;width:24px;height:24px;border-radius:50% 50% 0 50%;background:rgba(var(--tk-rgb),.14);color:var(--tk-soft);font-family:var(--display);font-size:11px;font-weight:700}
.step.on{background:var(--tk);color:var(--tk-ink);box-shadow:0 0 calc(22px*var(--glow)) rgba(var(--tk-rgb),.5)}
.step.on .n{background:rgba(255,255,255,.22);color:#fff}
.step .badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:11px;display:grid;place-items:center}
.step.on .badge{background:#fff;color:var(--tk)}
.step .recdot{width:8px;height:8px;border-radius:50%;background:var(--bad);animation:pulse 1s infinite}
.thumbs{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.thumb{position:relative;width:140px;height:100px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--hover)}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;transition:transform .3s}
.thumb:hover img{transform:scale(1.05)}
.thumb button{position:absolute;top:6px;right:6px;border:0;border-radius:8px;background:rgba(14,6,18,.75);color:#fff;cursor:pointer;width:24px;height:24px;display:grid;place-items:center}
.drop{border:1.5px dashed rgba(var(--tk-rgb),.35);border-radius:18px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;margin-top:14px;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:8px}
.drop:hover,.drop.over{border-color:var(--tk);background:rgba(var(--tk-rgb),.06);color:var(--ink)}
.drop .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(var(--tk-rgb),.12);color:var(--tk)}
.links{padding:0;list-style:none;margin:10px 0 0;display:grid;gap:6px}
.links li{display:flex;gap:10px;align-items:center;padding:8px 10px 8px 14px;border-radius:14px;background:var(--hover);border:1px solid var(--line2);word-break:break-all;font-size:13px}
.links li a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);text-decoration:none;font-weight:600}
.links li a:hover{color:var(--tk)}

/* grabador */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;background:var(--hover);text-align:left;transition:all .2s}
.mode:hover{border-color:rgba(var(--tk-rgb),.5)}
.mode.on{border-color:var(--tk);background:rgba(var(--tk-rgb),.09);box-shadow:0 0 calc(24px*var(--glow)) rgba(var(--tk-rgb),.2)}
.mode:disabled{opacity:.45;cursor:not-allowed}
.mode .mi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:rgba(var(--tk-rgb),.13);color:var(--tk);flex:none}
.mode b{display:block;font-size:14px;margin-bottom:3px}
.mode span{font-size:12.5px;color:var(--muted);line-height:1.45}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13px;color:var(--soft);cursor:pointer;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--hover)}
.consent input{margin-top:2px;accent-color:var(--tk);width:16px;height:16px}
.recstage{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;margin-top:22px;padding:22px;border-radius:22px;background:linear-gradient(140deg,rgba(var(--tk-rgb),.10),transparent 60%);border:1px solid var(--line)}
.recbtn{position:relative;width:96px;height:96px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#FF7FCB,var(--tk) 55%,#B0106A);color:#fff;font:800 11px var(--body);letter-spacing:.08em;display:grid;place-items:center;box-shadow:0 0 0 8px rgba(var(--tk-rgb),.14),0 14px 40px rgba(var(--tk-rgb),.45);transition:transform .2s;flex:none}
.recbtn:hover{transform:scale(1.04)}
.recbtn .in{display:flex;flex-direction:column;align-items:center;gap:4px}
.recbtn .core{width:22px;height:22px;border-radius:50%;background:#fff}
.recbtn.stop{background:radial-gradient(circle at 35% 30%,#3a1838,#1A0A1C);box-shadow:0 0 0 8px rgba(255,93,115,.15),0 0 40px rgba(255,93,115,.35)}
[data-theme=light] .recbtn.stop{background:radial-gradient(circle at 35% 30%,#4a2347,#22092A)}
.recbtn.stop .core{border-radius:5px;background:var(--bad);width:20px;height:20px}
.recbtn.stop::before,.recbtn.stop::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--bad);opacity:0;animation:ring 2s infinite}
.recbtn.stop::after{animation-delay:1s}
@keyframes ring{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.35);opacity:0}}
.recbtn:disabled{opacity:.4;cursor:not-allowed}
.clock{font-family:var(--display);font-size:clamp(30px,4vw,42px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.recinfo .hint{font-size:12.5px;color:var(--muted);margin-top:8px}
canvas.wave{display:block;width:100%;height:56px;margin-top:12px}
.segs{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.seg-t{font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--hover);color:var(--muted);border:1px solid var(--line2);display:inline-flex;gap:6px;align-items:center}
.seg-t.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.seg-t.run{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.seg-t.error{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.notice{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;background:color-mix(in srgb,var(--warn) 9%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice.err{background:color-mix(in srgb,var(--bad) 9%,transparent);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.pasos{margin:10px 0;padding-left:20px;display:grid;gap:4px}.pasos li::marker{color:var(--tk);font-weight:800}
.noteline{display:flex;gap:8px;margin-top:18px}
.noteline input{border-radius:999px;height:42px}
.notes{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.notes li{font-size:13px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--hover);border:1px solid var(--line2);display:flex;gap:10px;align-items:center}
.notes li span{flex:1}
.notes li b{font-family:var(--display);font-size:11px;font-weight:600;color:var(--tk);margin-right:6px}
textarea.transcript{min-height:300px;font-size:13.5px;line-height:1.65;border-radius:18px;padding:16px}

/* generación y resultados */
.checks{display:grid;gap:8px;margin:14px 0 20px}
.checks div{display:flex;gap:12px;align-items:center;font-size:13.5px;padding:10px 14px;border-radius:14px;background:var(--hover);border:1px solid var(--line2)}
.checks .ck{width:22px;height:22px;border-radius:50% 50% 0 50%;display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.checks .ck.on{background:var(--tk);border-color:var(--tk);color:#fff;box-shadow:0 0 calc(10px*var(--glow)) rgba(var(--tk-rgb),.5)}
.checks .ck svg{width:12px;height:12px;stroke-width:3}
.genstatus{display:flex;align-items:center;gap:12px;margin-top:16px;font-weight:700;color:var(--tk-soft)}
.spin{width:22px;height:22px;border:3px solid rgba(var(--tk-rgb),.2);border-top-color:var(--tk);border-radius:50%;animation:sp .9s linear infinite;box-shadow:0 0 calc(14px*var(--glow)) rgba(var(--tk-rgb),.4);flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.ins{border-left:3px solid var(--tk);background:linear-gradient(90deg,rgba(var(--tk-rgb),.13),var(--glass) 55%)}
.ins h3{color:var(--tk-soft);display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.ins p{margin:10px 0 0;color:var(--soft);font-size:14.5px;line-height:1.6}
.blist{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.blist li{position:relative;padding-left:22px;line-height:1.55;color:var(--soft);font-size:13.5px}
.blist li::before{content:"";position:absolute;left:0;top:7px;width:9px;height:9px;border-radius:50% 50% 0 50%;background:var(--k,var(--tk));box-shadow:0 0 calc(8px*var(--glow)) var(--k,var(--tk))}
.story{padding:0;overflow:hidden}
.story .sh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.story .sid{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:12px;color:var(--tk-soft)}
.story .sid i{display:grid;place-items:center;width:30px;height:30px;border-radius:50% 50% 0 50%;background:rgba(var(--tk-rgb),.16);border:1px solid var(--tk);font-style:normal;font-size:10.5px;color:var(--tk-soft)}
.story .sb{padding:18px 20px 20px}
.story .title{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.25;margin-bottom:12px}
.userstory{border-radius:16px;padding:14px 16px;background:rgba(var(--tk-rgb),.07);border:1px solid rgba(var(--tk-rgb),.22);font-size:14.5px;line-height:1.6}
.userstory b{color:var(--tk);font-weight:800}
.prio{height:30px;width:auto;border-radius:999px;padding:0 28px 0 12px;font-size:11.5px;font-weight:800;border:1px solid var(--line)}
.prio.Alta{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.prio.Media{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.prio.Baja{color:var(--muted)}
.sec{margin-top:18px}
.sec h4{font-family:var(--body);margin:0 0 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.sec .txt{color:var(--soft);font-size:13.5px;line-height:1.6}
.gherkin{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.gherkin li{border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.55;background:var(--hover)}
.gherkin .sc{font-weight:800;margin-bottom:4px;display:flex;gap:8px;align-items:center}
.gherkin .sc em{font-style:normal;font-family:var(--display);font-size:10px;font-weight:600;color:var(--tk-soft);background:rgba(var(--tk-rgb),.14);border-radius:6px;padding:2px 6px}
.gherkin .k{font-weight:800;display:inline-block;min-width:78px}
.gherkin .k.d{color:var(--it)}.gherkin .k.c{color:var(--ux)}.gherkin .k.e{color:var(--qa)}
details.areas{margin-top:18px;border-top:1px solid var(--line2);padding-top:14px}
details.areas summary{cursor:pointer;font-weight:800;font-size:13px;color:var(--tk-soft);list-style:none;display:flex;align-items:center;gap:8px}
details.areas summary::-webkit-details-marker{display:none}
details.areas summary svg{transition:transform .2s}
details[open].areas summary svg{transform:rotate(90deg)}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.area{border-radius:16px;padding:14px;background:color-mix(in srgb,var(--k) 7%,transparent);border:1px solid color-mix(in srgb,var(--k) 28%,transparent)}
.area .ah{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--k)}
.area .ah span{display:inline-flex;gap:8px;align-items:center}
.area ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.area li{position:relative;padding-left:16px;font-size:13px;line-height:1.5;color:var(--soft)}
.area li::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50% 50% 0 50%;background:var(--k)}
.area .none{font-size:12px;color:var(--muted);margin-top:8px}
.cols4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
.front{--k:var(--it)}.back{--k:var(--be)}
.subsec{margin-top:10px}.subsec h5{margin:0 0 3px;font:800 10px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.subsec .txt{font-size:13px;line-height:1.5;color:var(--soft)}
.area .blist{margin:4px 0 0;gap:4px}.area .blist li{font-size:13px;padding-left:16px}.area .blist li::before{width:7px;height:7px;top:7px;background:var(--k);box-shadow:none}
.rn{display:grid;gap:6px}.rn div{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5;color:var(--soft);padding:9px 12px;border-radius:12px;background:var(--hover);border:1px solid var(--line2)}
.rn em,.gherkin .sc em{font-style:normal;font-family:var(--display);font-size:10px;font-weight:600;color:var(--tk-soft);background:rgba(var(--tk-rgb),.14);border-radius:6px;padding:2px 6px;flex:none;margin-top:2px}
.qtable{display:grid;gap:6px}.qtable div{display:flex;gap:10px;align-items:center;font-size:13.5px;padding:8px 12px;border-radius:12px;background:var(--hover);border:1px solid var(--line2)}.qtable div span[contenteditable]{flex:1}
.dod{margin:0;padding:0;list-style:none;display:grid;gap:4px;color:var(--soft)}
.score{display:flex;gap:14px;align-items:center;margin-top:18px;padding:12px 14px;border-radius:14px;background:var(--hover);border:1px solid var(--line2)}
.score .bar{width:120px;height:8px;border-radius:4px;background:rgba(var(--tk-rgb),.12);overflow:hidden;flex:none}.score .bar div{height:100%;background:linear-gradient(90deg,var(--tk),var(--qa))}
@media(max-width:1100px){.cols4{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.cols4{grid-template-columns:1fr}.score{flex-direction:column;align-items:flex-start}}
.vozinfo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:13px;padding:10px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--hover)}.vozinfo svg{color:var(--qa)}.vozinfo a{margin-left:auto;font-weight:700}
.meter2{height:8px;border-radius:5px;background:rgba(var(--tk-rgb),.1);overflow:hidden;margin-bottom:14px}.meter2 div{height:100%;width:0;background:linear-gradient(90deg,var(--qa),var(--tk));transition:width .08s}
.frases{display:grid;gap:10px}
.frase{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--hover)}
.frase p{margin:0;font-size:16px;line-height:1.5;font-weight:600}
.frase .fn{display:grid;place-items:center;width:30px;height:30px;border-radius:50% 50% 0 50%;background:rgba(var(--tk-rgb),.14);color:var(--tk-soft);font:600 12px var(--display)}
.frase.on{border-color:var(--tk);box-shadow:0 0 calc(24px*var(--glow)) rgba(var(--tk-rgb),.25);background:rgba(var(--tk-rgb),.07)}
.frase.ok .fn{background:var(--qa);color:#fff}
.enr{border-color:rgba(var(--tk-rgb),.45)}
.ranking{display:grid;gap:8px}.ranking>div{display:grid;grid-template-columns:minmax(120px,1fr) 2fr 50px;gap:12px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--hover);font-size:13px}
.ranking>div.top{box-shadow:inset 0 0 0 1px var(--qa)}.ranking .bar{height:8px;border-radius:4px;background:rgba(var(--tk-rgb),.1);overflow:hidden}.ranking .bar>div{display:block;height:100%;background:linear-gradient(90deg,var(--tk),var(--qa));border-radius:0}
@media(max-width:760px){.frase{grid-template-columns:30px 1fr}.frase .btn{grid-column:1/-1}}
.subs{margin-top:18px;padding:16px;border-radius:18px;border:1px dashed rgba(var(--tk-rgb),.35);background:rgba(var(--tk-rgb),.03)}
.subs.empty{padding:12px 16px}
.subs-t{font:800 12px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--tk-soft);display:flex;gap:8px;align-items:center;margin:0}
.subgrid{display:grid;gap:8px}
.subcard{border-radius:14px;border:1px solid color-mix(in srgb,var(--k) 35%,transparent);background:color-mix(in srgb,var(--k) 6%,transparent)}
.subcard summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:11px 14px;flex-wrap:wrap}
.subcard summary::-webkit-details-marker{display:none}
.subcard summary b{flex:1;min-width:200px;font-size:13.5px}
.subcard .chev{color:var(--muted);transition:transform .2s}.subcard[open] .chev{transform:rotate(90deg)}
.subcard.na{padding:11px 14px;opacity:.75}.subcard .sh2{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.eqb{display:inline-flex;gap:6px;align-items:center;font:800 11px var(--body);color:var(--k);background:color-mix(in srgb,var(--k) 14%,transparent);padding:4px 10px;border-radius:999px;white-space:nowrap}
.sid2{font:600 10.5px var(--display);color:var(--muted)}
.subbody{padding:0 14px 14px}
.userstory.sm{font-size:13.5px;padding:10px 12px}
.tasks{margin:0;padding:0;list-style:none;display:grid;gap:4px}.tasks li{display:flex;gap:8px;font-size:13px;color:var(--soft)}.tasks li>span:first-child{color:var(--k)}
.admin{--k:var(--warn)}
.subcfg{padding:14px;border-radius:14px;border:1px solid var(--line2);background:var(--hover);margin-bottom:16px}
.vivo{border-color:rgba(var(--tk-rgb),.5);box-shadow:0 0 calc(30px*var(--glow)) rgba(var(--tk-rgb),.12),var(--shadow)}
.vivo h3 .dot{margin-right:2px}
.vivo-empty{display:flex;gap:12px;align-items:center;justify-content:center;padding:28px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.vivo-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.vivo-hu{padding:16px;border-radius:18px;background:var(--hover);border:1px solid var(--line2)}
.vivo-hu .title{font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:10px}
.vivo-subs{display:grid;gap:10px;align-content:start}
.vivo .subcard.open .vsh{padding:10px 14px 4px}
.gherkin.mini li{font-size:12.5px;padding:7px 10px}.gherkin.mini em{font-style:normal;font:600 10px var(--display);color:var(--tk-soft)}
.gherkin.mini{margin-top:8px}.gherkin.mini .k{min-width:0;margin:0 3px}
.nuevo{animation:nuevo 3.5s ease-out 1;border-radius:8px}
@keyframes nuevo{0%{background:rgba(var(--tk-rgb),.35);box-shadow:0 0 0 2px rgba(var(--tk-rgb),.6)}100%{background:transparent;box-shadow:none}}
@media(max-width:900px){.vivo-grid{grid-template-columns:1fr}}
.cont{border-color:color-mix(in srgb,var(--warn) 45%,transparent);margin-bottom:16px}
.cont h3{font-size:14px}
.partes{display:inline-flex;gap:12px;margin-left:6px}.partes a{display:inline-flex;gap:4px;align-items:center;font-weight:700;text-decoration:none}
.ux{--k:var(--ux)}.it{--k:var(--it)}.qa{--k:var(--qa)}
.quote{font-size:13px;color:var(--muted);font-style:italic;border-left:2px solid var(--tk);padding:2px 0 2px 12px;margin-top:10px}
[contenteditable]{outline:none;border-radius:6px;transition:background .15s}
[contenteditable]:hover{background:rgba(var(--tk-rgb),.06)}
[contenteditable]:focus{background:rgba(var(--tk-rgb),.1);box-shadow:0 0 0 2px rgba(var(--tk-rgb),.4)}
.dock{position:sticky;bottom:14px;z-index:20;margin-top:20px;border-radius:999px;padding:8px 8px 8px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--modal) 88%,transparent);border:1px solid rgba(var(--tk-rgb),.4);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 30px rgba(var(--tk-rgb),.18),0 20px 50px rgba(0,0,0,.3)}
.dock .sum{font-size:12.5px;color:var(--muted)}
.dock .sum b{font-family:var(--display);color:var(--ink);font-weight:600}
.navfoot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

/* =================== MODAL / TOAST =================== */
#modal .bg{position:fixed;inset:0;background:rgba(8,2,10,.62);backdrop-filter:blur(6px);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
#modal .box{position:relative;background:var(--modal);border:1px solid var(--line);border-radius:24px;max-width:680px;width:100%;max-height:90vh;overflow:auto;padding:26px;box-shadow:0 0 60px rgba(var(--tk-rgb),.18)}
#modal .box h2{font-size:20px;font-weight:700;margin-bottom:6px}
#modal .box.img{max-width:1100px;padding:10px}
#modal .box.img img{width:100%;display:block;border-radius:16px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;flex-wrap:wrap}
code{background:rgba(var(--tk-rgb),.12);color:var(--tk-soft);padding:1px 6px;border-radius:6px;font-size:12px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:max-content;max-width:92vw;justify-items:center}
.t{background:var(--modal);border:1px solid var(--tk);color:var(--ink);border-radius:999px;padding:11px 18px;font-size:13px;font-weight:700;box-shadow:0 0 24px rgba(var(--tk-rgb),.35);animation:tin .25s cubic-bezier(.2,.8,.2,1)}
.t.error{border-color:var(--bad);box-shadow:0 0 24px color-mix(in srgb,var(--bad) 35%,transparent)}
.t.ok{border-color:var(--good);box-shadow:0 0 24px color-mix(in srgb,var(--good) 30%,transparent)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.rv{animation:rv .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rv{from{opacity:0;transform:translateY(12px)}}
footer{color:var(--muted);font-size:11.5px;text-align:center;padding:0 0 30px}

@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.cols3{grid-template-columns:1fr}}
@media(max-width:760px){
  .grid2,.modes{grid-template-columns:1fr}
  .brand small,.status .txt,.btn .lbl,.hide-m{display:none!important}
  .hrow{gap:8px}.status{padding:8px}
  .btn{padding:0 12px}
  .recstage{grid-template-columns:1fr;justify-items:center;text-align:center}
  .recinfo{width:100%}
  .dock{border-radius:22px;padding:10px}
  main{padding-top:20px}
  .card{padding:18px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

class CupoError extends Error { constructor(msg, diario) { super(msg); this.cupo = true; this.diario = diario; } }
async function groqFetch(path, opts, intentos = 5, onWait) {
  if (!cfg.groqKey) throw new Error('Falta la API key de Groq (Configuración).');
  for (let i = 0; i < intentos; i++) {
    let r;
    try { r = await fetch('https://api.groq.com/openai/v1' + path, { ...opts, headers: { Authorization: 'Bearer ' + cfg.groqKey, ...(opts.headers || {}) } }); }
    catch (e) { if (i < intentos - 1) { onWait?.('Sin conexión con Groq, reintento en 10 s…'); await sleep(10000); continue; } throw new Error('Sin conexión con Groq: ' + e.message); }
    if (r.status === 429) {
      let msg = ''; try { msg = (await r.clone().json()).error?.message || ''; } catch { }
      const ra = parseFloat(r.headers.get('retry-after')) || 20;
      const diario = /per day|\(TPD\)|\(RPD\)|\(ASD\)|tokens per day|requests per day/i.test(msg) || ra > 120;
      if (diario || i === intentos - 1) throw new CupoError(msg || 'Límite de Groq alcanzado', diario);
      onWait?.(`Esperando el límite por minuto del plan gratuito de Groq (${Math.ceil(ra)} s)…`);
      await sleep((ra + 1) * 1000); continue;
    }
    if (r.status >= 500 && i < intentos - 1) { onWait?.('Groq no respondió, reintento en 8 s…'); await sleep(8000); continue; }
    if (!r.ok) { let m = ''; try { m = (await r.json()).error?.message; } catch { } throw new Error(m || 'Error de Groq ' + r.status); }
    return r;
  }
}

    const lugar = 8000 - maxOut - estimTokens(sysVivo(s) + contextoTexto(s, false) + JSON.stringify(actual || {})) - 500;
    const partes = estimTokens(fragmento) > lugar ? partir(fragmento, Math.max(2500, Math.floor(lugar * 3.4))) : [fragmento];
    let borrador = actual;
    for (let i = 0; i < partes.length; i++) {
      const res = await chat([
        { role: 'system', content: sysVivo(s) },
        { role: 'user', content: `${contextoTexto(s, false)}\n\nBORRADOR ACTUAL:\n${borrador ? JSON.stringify(borrador) : '(todavía no hay borrador: crealo)'}\n\nNUEVO FRAGMENTO DE LA REUNIÓN (${etiqueta}${partes.length > 1 ? `, parte ${i + 1}/${partes.length}` : ''}):\n${partes[i]}` }
      ], { onWait: m => { ui.msg = m; refrescarVivo(s); }, max: maxOut, rol: 'vivo' });
      borrador = normVivo(res); delete borrador.tramos; delete borrador.actualizado;
    }
    const antes = vivoClaves(s.vivo);
    s.vivo = normVivo({ ...borrador, tramos: (s.vivo?.tramos || 0) + 1, actualizado: Date.now() });
    ui.nuevos = new Set([...vivoClaves(s.vivo)].filter(k => !antes.has(k)));
    ui.estado = 'ok'; ui.msg = '';

}

async function comprimir(blobOrFile, max = 1400, q = 0.75) {
  const url = URL.createObjectURL(blobOrFile);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}

/* ---- generación en 2 fases: minuta + una llamada por historia ---- */
/* ---- generación pensada para reuniones largas (2 h) con el plan gratuito de Groq ----
   · Durante la grabación, cada bloque de ~6 min se resume en notas (modelo "resumen").
   · Al final, las historias se arman desde esas notas: no hace falta releer 2 h de transcripción.
   · Cada historia se redacta en 2 pedidos chicos (núcleo + equipos) para entrar en 8.000 tokens/min,
     y los equipos y las sub-historias usan otros modelos en paralelo para repartir los cupos. */
function setGen(msg) { GEN.msg = msg; const el = $('#genmsg') || $('#genDisenoMsg'); if (el) el.textContent = msg; }
const SYS_NOTAS = 'Sos analista funcional de Producto de Tokin (tienda B2B de Arcor). Tomá notas de este fragmento de una reunión de refinamiento en viñetas MUY concisas, agrupadas así (omití los grupos vacíos): DECISIONES · IDEAS (no decididas) · REGLAS (con números, límites, vigencias, unidades, países) · UX · IT FRONT · IT BACK · ADMIN · QA · DUDAS · CONTRADICCIONES · ACCIONES (con responsable). Indicá quién lo dijo si figura. Frases textuales clave entre comillas. Máximo 220 palabras. En español, sin introducción.';
function partir(t, n) {
  const out = []; let i = 0;
  while (i < t.length) { let j = Math.min(t.length, i + n); if (j < t.length) { const k = Math.max(t.lastIndexOf('\n', j), t.lastIndexOf('. ', j)); if (k > i + n * 0.6) j = k + 1; } out.push(t.slice(i, j)); i = j; }
  return out;
}
// Comprime un texto largo a ~presupuesto tokens, resumiendo por partes con 2 modelos en paralelo.
async function comprimirHasta(texto, presupuesto, etiqueta) {
  for (let ronda = 0; ronda < 4 && estimTokens(texto) > presupuesto; ronda++) {
    const partes = partir(texto, 17000), notas = new Array(partes.length); let hechas = 0;
    const tarea = async (i) => {
      notas[i] = await chat([{ role: 'system', content: SYS_NOTAS }, { role: 'user', content: partes[i] }], { json: false, max: 900, rol: i % 2 ? 'vivo' : 'resumen', onWait: setGen });
      setGen(`Reunión larga: resumiendo ${++hechas} de ${partes.length} partes${ronda ? ' (segunda pasada)' : ''}…`);
    };
    setGen(`Reunión larga: resumiendo ${partes.length} partes…`);
    for (let i = 0; i < partes.length; i += 2) await Promise.all([tarea(i), i + 1 < partes.length ? tarea(i + 1) : null]);
    texto = notas.map((n, i) => `--- Parte ${i + 1} ---\n${n}`).join('\n\n'); etiqueta = 'NOTAS DE LA REUNIÓN (resumida por partes)';
  }
  return `${etiqueta}:\n${recortar(texto, presupuesto)}`;
}
async function materialFinal(s, presupuesto = 2400) {
  const t = s.transcripcion.trim();
  const clave = `${t.length}|${(s.notasBloques || []).length}|${presupuesto}`;
  if (s._material?.clave === clave) return s._material.texto;
  let texto;
  if (!t && !(s.notasBloques || []).length) texto = 'TRANSCRIPCIÓN:\n(sin transcripción: usá las notas de Producto y el contexto)';
  else if ((s.notasBloques || []).length && (s.notasChars || 0) >= t.length * 0.85)
    texto = await comprimirHasta(s.notasBloques.map(n => `--- ${n.et} ---\n${n.texto}`).join('\n\n'), presupuesto, 'NOTAS DE LA REUNIÓN (tomadas en vivo cada ~6 min)');
  else texto = await comprimirHasta(t, presupuesto, 'TRANSCRIPCIÓN DE LA REUNIÓN');
  s._material = { clave, texto };
  return texto;
}

async function generar() {

    if ((s.imagenes || []).length && !s.analisisDiseno.trim()) { s.analisisDiseno = await leerDiseno(setGen); guardarLuego(s); }
    const material = (await materialFinal(s)) + vivoRef(s);
    setGen('Armando la minuta y el plan de historias…');

    const plan = arr(min.historias).map(p => ({ titulo: toStr(p.titulo || ''), epica: toStr(p.epica || ''), foco: toStr(p.foco || ''), base: toStr(p.base || '').toUpperCase().match(/HU-\d+/)?.[0] || '', cambios: p.cambios !== false })).filter(p => p.titulo);

    const pendientes = [];
    for (let i = 0; i < plan.length; i++) {
      const previa = plan[i].base && (s._previa?.resultado?.historias || []).find(h => h.id === plan[i].base);
      if (previa && !plan[i].cambios) {
        const hu = normHU(clone(previa), i); hu.subs = clone(previa.subs || []);
        s.resultado.historias.push(hu); await Store.guardar(s); repintarHistorias(s); continue;
      }

      const extra = previa ? `\n\nVERSIÓN ANTERIOR DE ESTA HISTORIA (${previa.id}, Parte ${s._previa.parte || 1}): actualizala con lo nuevo, conservá lo que no cambió, mantené la numeración de RN y CA y sacá de preguntas lo que hoy se respondió:\n${JSON.stringify(huCompacta(previa))}` : '';
      const hu = normHU(await redactarNucleo(s, material, plan[i], i, extra), i);

}
async function ajustar() {

      const res = await chat([
        { role: 'system', content: sysMinuta(s) + '\n\nAhora recibís la minuta actual y un pedido de ajuste de Producto. Devolvé la minuta COMPLETA actualizada con el mismo esquema, manteniendo lo que no se pidió cambiar.' },

        const hu = normHU(await redactarNucleo(s, material, { titulo: '(definir según el pedido)', foco: pedido }, i, `\n\nPEDIDO DE PRODUCTO PARA ESTA HISTORIA NUEVA:\n${pedido}`), i);

        setGen(`Completando equipos y sub-historias de ${hu.id}…`); await completarHU(s, hu, material);

      }

}

  nuevaVoz: () => { PRB = null; ENR = { paso: 'datos', fuente: 'mic', tramos: [] }; renderVoces(); },
  repetirVoz: el => { const v = VOCES.find(x => x.id === el.dataset.id); PRB = null; ENR = { paso: 'datos', fuente: v.fuente || 'mic', tramos: [], id: v.id, nombre: v.nombre, area: v.area }; renderVoces(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
  borrarVoz: async el => { const v = VOCES.find(x => x.id === el.dataset.id); if (!confirm(`¿Borrar la voz de ${v.nombre}?`)) return; await Store.borrarVoz(v.id); VOCES = VOCES.filter(x => x.id !== v.id); toast('Voz borrada'); renderVoces(); },
  cancelarVoz: () => { clearInterval(ENR?.timer); ENR?.cap?.cerrar(); ENR = null; renderVoces(); },
  enrFuente: el => { ENR.nombre = $('#enrNombre')?.value || ENR.nombre; ENR.area = $('#enrArea')?.value || ENR.area; ENR.ok = $('#enrOk')?.checked; ENR.fuente = el.dataset.v; renderVoces(); },
  enrEmpezar: () => enrEmpezar(),
  enrGrabar: el => enrGrabar(+el.dataset.i),
  enrParar: () => enrParar(),
  enrProcesar: () => enrProcesar(),
  enrVolver: () => { ENR.paso = 'frases'; renderVoces(); },
  enrGuardar: () => enrGuardar(),
  probarVoz: () => { ENR = null; PRB = { estado: 'inicio' }; renderVoces(); },
  cerrarPrueba: () => { PRB = null; renderVoces(); },
  prbGrabar: el => prbGrabar(el.dataset.v),
  config: () => abrirConfig(),
  theme: () => { cambiarTema(); if (REC.activo === false && VISTA === 'sesion' && TAB === 'reunion') dibujarWaveQuieta(); },
  cerrarModal: () => $('#modal').innerHTML = '',
  guardarConfig: () => guardarConfigUI(),
  probarGroq: () => probarGroq(),
  open: el => { if (REC.activo && VISTA === 'sesion') toast('La grabación sigue activa en segundo plano.'); abrirSesion(el.dataset.id); },
  borrar: async () => {
    if (REC.activo && REC.sid === S.id) return toast('Detené la grabación antes de eliminar.', 'error');
    if (!confirm(`¿Eliminar "${S.titulo}"? No se puede deshacer.`)) return;
    await Store.borrar(S.id); toast('Sesión eliminada'); VISTA = 'lista'; render();
  },
  part: el => { const v = el.dataset.v, P = S.contexto.participantes; const i = P.indexOf(v); i >= 0 ? P.splice(i, 1) : P.push(v); guardarLuego(); el.classList.toggle('on', i < 0); },
  addFigma: () => { const v = $('#figmaUrl')?.value.trim(); if (!v) return; if (!/figma\.com/.test(v)) return toast('Ese no parece un link de Figma.', 'error'); S.contexto.figma.push(v); guardarLuego(); renderSesion(); },
  addPersona: () => {
    const n = $('#pNombre')?.value.trim(); if (!n) return toast('Escribí el nombre.');
    const areaSel = $('#pArea').value; ULTIMA_AREA = areaSel;
    if (S.contexto.personas.some(p => p.nombre.toLowerCase() === n.toLowerCase())) return toast(n + ' ya está en la lista.');
    S.contexto.personas.push({ nombre: n, area: areaSel }); toast(`${n} sumado/a como ${areaSel}`, 'ok');
    const a = $('#pArea').value.replace(' (Desarrollo)', ''); const map = { IT: 'IT (Desarrollo)' };
    const area = map[a] || a; if (AREAS.includes(area) && !S.contexto.participantes.includes(area)) S.contexto.participantes.push(area);
    guardarLuego(); renderSesion(); setTimeout(() => $('#pNombre')?.focus(), 30);
  },
  areaPersona: el => { const L = ['UX', 'IT', 'QA', 'Producto', 'Otro'], p = S.contexto.personas[+el.dataset.i]; p.area = L[(L.indexOf(p.area) + 1) % L.length]; guardarLuego(); renderSesion(); },
  delPersona: el => { S.contexto.personas.splice(+el.dataset.i, 1); guardarLuego(); renderSesion(); },
  delFigma: el => { S.contexto.figma.splice(+el.dataset.i, 1); guardarLuego(); renderSesion(); },
  figmaImg: el => traerFigma(S.contexto.figma[+el.dataset.i]),
  delImg: async el => { S.imagenes.splice(+el.dataset.i, 1); S.cantImagenes = S.imagenes.length; await Store.guardarImagenes(S.id, S.imagenes); guardarLuego(); renderSesion(); },
  verImg: el => { $('#modal').innerHTML = `<div class="bg" data-action="cerrarModal"><div class="box img"><img src="${S.imagenes[+el.dataset.i]}" alt=""></div></div>`; },
  leerDiseno: async () => {
    if (!cfg.groqKey) { toast('Primero conectá Groq.', 'error'); return abrirConfig(); }
    const s = S; GEN = { activo: true, sid: s.id, msg: 'Leyendo diseño…' };
    const box = $('#genDiseno'); if (box) box.innerHTML = `<div class="genstatus"><div class="spin"></div><span id="genDisenoMsg">Leyendo diseño…</span></div>`;
    try { s.analisisDiseno = await leerDiseno(setGen); await Store.guardar(s); toast('Diseño leído', 'ok'); } catch (e) { toast('No se pudo leer: ' + e.message, 'error', 6000); }
    GEN = { activo: false, msg: '' }; if (S === s && TAB === 'contexto') renderSesion();
  },
  modo: el => { S.modoGrabacion = el.dataset.v; guardarLuego(); renderSesion(); },
  grabar: () => iniciarGrabacion(),
  detener: () => detenerGrabacion(),
  reintentar: () => reintentarFallidos(),
  nota: () => {
    const inp = $('#nota'); const t = inp?.value.trim(); if (!t) return;
    const ts = REC.activo && REC.sid === S.id ? fmtT(Date.now() - REC.inicio) : 'NOTA';
    S.notas.push({ t: ts, texto: t }); inp.value = ''; guardarLuego();
    const ul = $('#notas'); if (ul) ul.innerHTML = pintarNotas();
    inp.focus();
  },
  delNota: el => { S.notas.splice(+el.dataset.i, 1); guardarLuego(); const ul = $('#notas'); if (ul) ul.innerHTML = pintarNotas(); },
  dlTrans: () => descargar(`transcripcion-${slug(S.titulo)}.txt`, S.transcripcion),
  irGenerar: () => { TAB = 'historias'; renderSesion(); window.scrollTo({ top: 0, behavior: 'smooth' }); if (!S.resultado && (S.transcripcion.trim() || S.notas.length)) generar(); },
  generar: () => generar(),
  ajustar: () => ajustar(),
  copiarHU: el => { const h = S.resultado.historias[+el.dataset.i]; copiar(huMarkdown(h), `${h.id} completa copiada (13 secciones)`); },
  subEq: el => { const v = el.dataset.v, L = S.subEquipos || EQUIPOS.map(e => e.k); S.subEquipos = L.includes(v) ? L.filter(x => x !== v) : EQUIPOS.map(e => e.k).filter(k => L.includes(k) || k === v); guardarLuego(); el.classList.toggle('on'); },
  continuar: () => continuarSesion(S),
  copiarVivo: () => copiar(vivoMarkdown(S), 'Borrador en vivo copiado'),
  vivoTodo: () => vivoDesdeTranscripcion(S),
  copiarSub: el => { const h = S.resultado.historias[+el.dataset.i], sb = h.subs[+el.dataset.j]; copiar(subMarkdown(h, sb), `${idSub(h, sb)} copiada`); },
  copiarSubs: el => { const h = S.resultado.historias[+el.dataset.i]; copiar(h.subs.map(sb => subMarkdown(h, sb)).join('\n\n---\n\n'), `Sub-historias de ${h.id} copiadas`); },
  genSubs: async el => {
    const s = S, i = +el.dataset.i, hu = s.resultado.historias[i];
    if (hu.subs?.length && !confirm('Se rehacen las sub-historias de ' + hu.id + ' y se pierden las ediciones. ¿Seguimos?')) return;
    GEN = { activo: true, sid: s.id, msg: `Armando sub-historias de ${hu.id}…` }; renderSesion();
    try { hu.subs = await redactarSubs(s, null, null, hu); await Store.guardar(s); toast('Sub-historias listas', 'ok'); }
    catch (e) { toast('No se pudieron armar: ' + e.message, 'error', 7000); }
    GEN = { activo: false, msg: '' }; if (S === s) renderSesion();
  },
  copiarJira: el => { const h = S.resultado.historias[+el.dataset.i]; copiar(huJira(h), `${h.id} copiada en versión corta para Jira`); },
  delHU: el => { const i = +el.dataset.i; if (!confirm(`¿Eliminar ${S.resultado.historias[i].id}?`)) return; S.resultado.historias.splice(i, 1); S.resultado.plan.splice(i, 1); S.resultado.historias.forEach((h, k) => h.id = 'HU-' + pad2(k + 1)); guardarLuego(); renderSesion(); },
  copiarArea: el => { const k = el.dataset.k, r = S.resultado, nom = { ux: 'UX', front: 'IT Front', back: 'IT Back', qa: 'QA' }[k]; const extra = r.historias.flatMap(h => itemsArea(h, k).map(x => `- ${h.id}: ${x}`)); copiar(`${S.titulo} · ${nom}\n\nPendientes de la reunión:\n${r.pendientes[k].map(x => '- ' + x).join('\n') || '- —'}${extra.length ? '\n\nPor historia:\n' + extra.join('\n') : ''}`, `Pendientes de ${nom} copiados`); },
  copiarTodo: () => copiar(minutaMarkdown()),
  dlMd: () => descargar(`minuta-${slug(S.titulo)}.md`, minutaMarkdown(), 'text/markdown'),
  dlCsv: () => { if (!S.resultado.historias.length) return toast('No hay historias para exportar.'); descargar(`historias-jira-${slug(S.titulo)}.csv`, csvJira(), 'text/csv'); toast('CSV listo: en Jira → Importar incidencias desde CSV', 'ok', 5000); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t && VISTA === 'sesion') { TAB = t.dataset.tab; renderSesion(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const a = e.target.closest('[data-action]');
  if (!a || a.disabled) return;
  if (a.dataset.action === 'cerrarModal' && e.target !== a && a.classList.contains('bg')) return;
  const fn = acciones[a.dataset.action]; if (fn) { e.preventDefault(); fn(a); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind && S) {
    setPath(S, el.dataset.bind, el.value); guardarLuego();
    if (el.dataset.bind === 'transcripcion') { const wc = $('#wc'); if (wc) wc.textContent = palabras(el.value) + ' palabras'; }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.bindCheck && S) { S[el.dataset.bindCheck] = el.checked; guardarLuego(); }
  if (el.dataset.bind === 'tipo' && S) renderSesion();
  if (el.dataset.prio != null && S?.resultado) { S.resultado.historias[+el.dataset.prio].prioridad = el.value; guardarLuego(); el.className = 'prio ' + el.value; }
});
document.addEventListener('focusout', e => {
  const el = e.target; if (!el.dataset?.edit || !S?.resultado) return;
  const v = el.innerText.replace(/\s+\n/g, '\n').trim();
  if (getPath(S.resultado, el.dataset.edit) !== v) { setPath(S.resultado, el.dataset.edit, v); guardarLuego(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('#modal').innerHTML = '';
  if (e.key === 'Enter' && !e.shiftKey && e.target.dataset?.edit !== undefined && !['DIV', 'P'].includes(e.target.tagName)) { e.preventDefault(); e.target.blur(); }
});
window.addEventListener('resize', () => { if (!REC.activo && VISTA === 'sesion' && TAB === 'reunion') dibujarWaveQuieta(); });

/* ---------------- inicio ---------------- */
(async function init() {
  cargarConfig(); pintarBotonTema(); pintarStatus();
  await Store.init();
  try { VOCES = await Store.listarVoces(); } catch { VOCES = []; }
  render();
  if (!cfg.groqKey) setTimeout(abrirConfig, 400);
})();
</script>
</body>
</html>
